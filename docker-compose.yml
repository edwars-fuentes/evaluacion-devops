version: '3.8'

services:
  microservicio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microservicio_devops_container
    ports:
      - "8080:8080"
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3