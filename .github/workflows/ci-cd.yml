# 2. Análisis de Seguridad y Dependencias (IE3)
  security-analysis:
    name: Escaneo de Seguridad y Dependencias
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Chequear codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Resolver dependencias localmente
        run: mvn dependency:resolve

      - name: Escaneo de vulnerabilidades con Snyk / Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1' # Bloquea el pipeline si encuentra vulnerabilidades severas
          severity: 'CRITICAL,HIGH'