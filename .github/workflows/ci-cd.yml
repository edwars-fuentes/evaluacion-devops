name: CI/CD Pipeline - Microservicio DevOps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Pruebas unitarias (IE2)
  unit-tests:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Chequear codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas con Maven
        run: mvn test

  # 2. Análisis de Seguridad y Dependencias (IE3)
  security-analysis:
    name: Escaneo de Seguridad y Dependencias
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Chequear codigo
        uses: actions/checkout@v4

      - name: Escaneo de vulnerabilidades con Snyk / Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1' # Bloquea el pipeline si encuentra vulnerabilidades severas
          severity: 'CRITICAL,HIGH'

  # 3. Construcción de Imagen Docker (IE1 / IE4)
  build-docker:
    name: Construccion de Imagen Docker
    runs-on: ubuntu-latest
    needs: security-analysis
    steps:
      - name: Chequear codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir Imagen Docker
        run: |
          docker build -t microservicio-devops:latest .